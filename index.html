<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eaf4fb">
  <title>Meet Garchomp</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <p class="eyebrow">A little Pokémon field guide</p>
    <h1>Meet Garchomp</h1>
    
    <section class="card" aria-labelledby="pokemon-name">
      <div class="artwork-wrap">
        <img id="pokemon-image" alt="" hidden>
        <span id="image-fallback" class="image-fallback" aria-hidden="true">?</span>
      </div>
      <div class="details">
        <p id="pokemon-number" class="pokemon-number">Loading Pokémon…</p>
        <h2 id="pokemon-name">Garchomp</h2>
        <div id="pokemon-types" class="types" aria-label="Pokémon types"></div>
        <p id="pokemon-height" class="height"></p>
      </div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <button id="load-button" type="button">Load Garchomp</button>
    <p class="source">Data from <a href="https://pokeapi.co/api/v2/pokemon/garchomp" target="_blank" rel="noreferrer">PokéAPI</a></p>
  </main>
</body>
</html>
